[project]
name = "causalatee"
authors = [
    { name = "Tim Hagen", email = "tim.hagen@uni-kassel.de" },
]
description = "A toolkit for causality deep learning."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas[pyarrow]~=2.3",
]
dynamic = ["version"]

[project.optional-dependencies]
tests = [
    "bandit[toml]~=1.7",
    "mypy~=1.5",
    "pandas-stubs~=2.0",
    "pytest~=8.0",
    "pytest-cov>=5.0,<8.0",
    "runnb~=1.0",
    "ruff>=0.9,<0.15",
    "types-pyyaml~=6.0",
]
docs = [
    "mkdocs~=1.6",
    "mkdocs-material~=9.5",
    "mkdocs-bibtex~=2.16",
    "mike~=2.1",
]

[project.urls]
"Homepage" = "https://github.com/TheMrSheldon/causality-toolkit"
"Bug Tracker" = "https://github.com/TheMrSheldon/causality-toolkit/issues"

[build-system]
requires = ["setuptools>=75,<81", "setuptools-scm>=8,<10"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["build", "venv"]

[tool.setuptools_scm]
root = "./"

[tool.ruff]
exclude = ["build", "venv", "resources"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "I"]

[tool.mypy]
exclude = ["build", "venv", "resources"]

[tool.bandit]
exclude_dirs = ["build", "venv", "resources"]

[tool.bandit.assert_used]
skips = ["**/test_*.py"]

[tool.pytest.ini_options]
log_cli = true