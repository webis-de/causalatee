name: Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[tests]"

      - name: ruff lint
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        # -p (package mode), not a bare directory path: the package directory is now named the same as the repo root
        # ("causalatee"), which makes a bare `mypy causalatee/` ambiguous between "scan this directory" and "resolve
        # this package" (manifests as spurious "source file found twice" / unresolved relative-import errors).
        run: mypy -p causalatee

      - name: bandit
        run: bandit -c pyproject.toml -r causalatee/
