name: Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ".[tests]"

      - name: ruff lint
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy ctk/

      - name: bandit
        run: bandit -c pyproject.toml -r ctk/
