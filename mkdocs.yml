site_name: Causalatee
site_url: https://causalatee.webis.de/
repo_url: https://github.com/webis-de/causalatee
repo_name: webis-de/causalatee
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.tooltips
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

hooks:
  - docs/hooks.py

plugins:
  - search
  - awesome-pages
  - section-index
  - mike
  - mkdocs-jupyter:
      execute: false
      include_source: true
      include: ["examples/*.ipynb"]
  - macros:
      module_name: docs/hooks
  - bibtex:
      bib_dir: docs/references
      csl_file: docs/chicago-author-date.csl
      cite_inline: true
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            docstring_style: google
            merge_init_into_class: true

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

copyright: Copyright &copy; 2026 Webis

extra:
  generator: true
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/webis-de
      name: Webis on GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/webis_de
      name: Webis on X
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/webis
      name: Webis on YouTube

extra_css:
  - css/pills.css

extra_javascript:
  - js/dataset-page.js
  - js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Tasks:
      - Causality Detection: tasks/causality_detection.md
      - Causality Extraction: tasks/causality_extraction.md
      - Causality Identification: tasks/causality_identification.md
      - Causal Event Candidate Detection: tasks/causal_event_candidate_detection.md
  - Examples:
      - examples/index.md
      - Causality Detection: examples/detection.ipynb
      - Causal Candidate Extraction: examples/candidate_extraction.ipynb
      - Causality Identification: examples/identification.ipynb
      - SDP Causality Extraction: examples/sdp_causality_extraction.ipynb
      - CauseNet and CGF: examples/causenet_cgf.ipynb
      - Mining a Causal Graph: examples/mining.ipynb
  - ...
